name: Publish

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'none'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: calc
        run: |
          # Get latest tag, or v0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Remove 'v' prefix
          VERSION=${LATEST_TAG#v}
          # Handle cases where version might have suffixes (like -dev.1)
          BASE_VERSION=$(echo $VERSION | cut -d'-' -f1)
          
          # Split into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          
          BUMP="${{ github.event.inputs.version_bump }}"
          if [ "${{ github.event_name }}" == "push" ]; then
            BUMP="none"
          fi
          
          if [ "$BUMP" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" == "patch" ]; then
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          
          if [ "$BUMP" == "none" ] || [ "${{ github.event_name }}" == "push" ]; then
            NEW_VERSION="$NEW_VERSION-dev.${{ github.run_number }}"
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Calculated version: $NEW_VERSION"

  build:
    needs: calculate-version
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos-android
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        if: matrix.platform == 'macos-android'
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Android APK
        if: matrix.platform == 'macos-android'
        run: ./gradlew :androidApp:assembleRelease

      - name: Build iOS App
        if: matrix.platform == 'macos-android'
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Desktop (Mac)
        if: matrix.platform == 'macos-android'
        run: ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg

      - name: Build Desktop (Windows)
        if: matrix.platform == 'windows'
        run: ./gradlew :desktopApp:packageMsi :desktopApp:packageExe

      - name: Build Desktop (Linux)
        if: matrix.platform == 'linux'
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:packageAppImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            androidApp/build/outputs/apk/release/*.apk
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/pkg/*.pkg
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
            desktopApp/build/compose/binaries/main/appimage/*.AppImage
            iosApp/build/Build/Products/Debug-iphoneos/*.app

  publish:
    needs: [calculate-version, build]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.calculate-version.outputs.version }}
          name: ${{ needs.calculate-version.outputs.is_prerelease == 'true' && 'Dev Build ' || '' }}v${{ needs.calculate-version.outputs.version }}
          prerelease: ${{ needs.calculate-version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
