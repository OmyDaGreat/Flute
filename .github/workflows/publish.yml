name: Publish

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version in Semantic Versioning format (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-debug:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  build-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v8
        with:
          name: android-apk-release
          path: androidApp/build/outputs/apk/release/*.apk

  publish-release:
    needs: build-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Android Release APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk-release
          path: artifacts/android

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          prerelease: false
          generate_release_notes: true
          files: artifacts/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-dev:
    needs: build-debug
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Android Debug APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk-debug
          path: artifacts/android

      - name: Create dev pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.0-dev.${{ github.run_number }}
          name: Dev Build v0.0.0-dev.${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
